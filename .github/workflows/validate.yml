name: Cross-platform validation

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Show runtime versions
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          python --version

      - name: Run isolated safety regression
        shell: pwsh
        run: python -I -B ./codex-cleaner/scripts/test_codex_storage_guard.py
